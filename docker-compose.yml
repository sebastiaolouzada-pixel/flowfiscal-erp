version: '3.8'

services:
  # =====================
  # PostgreSQL Database
  # =====================
  db:
    image: postgres:15-alpine
    container_name: flowfiscal-db
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowfiscal-network

  # =====================
  # FastAPI Backend
  # =====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowfiscal-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ENVIRONMENT: ${ENVIRONMENT}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flowfiscal-network

  # =====================
  # Next.js Frontend
  # =====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowfiscal-frontend
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - flowfiscal-network

  # =====================
  # PgAdmin (Gerenciador DB)
  # =====================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: flowfiscal-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@flowfiscal.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - flowfiscal-network

volumes:
  postgres_data:

networks:
  flowfiscal-network:
    driver: bridge
